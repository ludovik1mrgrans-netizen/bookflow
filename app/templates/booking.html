<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>{{b.name}}</title></head><body><main><div class="hero"><div class="brand">🐾</div><div><h1>{{b.name}}</h1><p class="muted">Online zakazivanje · {{b.address}}</p></div></div><div class="notice">Termin možete rezervisati za manje od jednog minuta.</div><form method="get" action="/b/{{b.slug}}" id="picker"><label>1. Izaberite uslugu</label><div class="services">{% for s in services %}<label class="card"><input type="radio" name="service_id" value="{{s.id}}" {% if service and s.id==service.id %}checked{% endif %} onchange="this.form.submit()"><b>{{s.name}}</b><span>{{s.duration_min}} min · {{'{:,}'.format(s.price_rsd).replace(',', '.')}} RSD</span></label>{% endfor %}</div><label>2. Izaberite groomera</label><select name="employee_id" onchange="this.form.submit()">{% for e in employees %}<option value="{{e.id}}" {% if employee and e.id==employee.id %}selected{% endif %}>{{e.name}}</option>{% endfor %}</select><label>3. Datum</label><select name="day" onchange="this.form.submit()">{% for d in days %}<option value="{{d}}" {% if d==day %}selected{% endif %}>{{weekday[d.weekday()]}} · {{d.strftime('%d.%m.%Y')}}</option>{% endfor %}</select></form><form method="post" action="/b/{{b.slug}}/book"><input type="hidden" name="service_id" value="{{service.id if service else ''}}"><input type="hidden" name="employee_id" value="{{employee.id if employee else ''}}"><input type="hidden" name="day" value="{{day}}"><label>4. Slobodan termin</label><div class="slots">{% for x in slots %}<label><input type="radio" name="slot" value="{{x}}" required><span>{{x}}</span></label>{% else %}<p class="muted">Nema slobodnih termina za ovaj datum.</p>{% endfor %}</div><label>5. Vaši podaci</label><input name="customer_name" placeholder="Ime i prezime" required maxlength="80"><input name="phone" placeholder="Telefon, npr. +381 6x..." required maxlength="40"><input name="pet_name" placeholder="Ime ljubimca" maxlength="80"><textarea name="note" placeholder="Napomena (rasa, veličina, posebne želje...)" maxlength="500"></textarea><label class="consent"><input type="checkbox" required> <span>Saglasan/na sam da se podaci koriste za obradu rezervacije.</span></label><button {% if not slots %}disabled{% endif %}>Rezerviši termin</button></form><p class="footer">BookFlow · jednostavno online zakazivanje</p></main></body></html>
