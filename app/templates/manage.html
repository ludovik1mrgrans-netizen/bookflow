<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Moja rezervacija</title></head><body><main class="center"><div class="brand">🐾</div><h1>Moja rezervacija</h1><div class="summary"><p><b>{{service.name}}</b></p><p>{{a.starts_at.strftime('%d.%m.%Y u %H:%M')}}</p><p>Groomer: {{employee.name}}</p><p>{{a.customer_name}} · {{a.phone}}</p><p>Status: <span class="pill {{a.status}}">{{a.status}}</span></p></div>{% if a.status != 'cancelled' and a.starts_at > a.created_at %}<form method="post" action="/manage/{{a.manage_token}}/cancel" onsubmit="return confirm('Da li želite da otkažete termin?')"><button class="danger">Otkaži termin</button></form>{% endif %}<a class="button secondary" href="/b/{{b.slug}}">Nova rezervacija</a></main></body></html>
